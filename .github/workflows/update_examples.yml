name: Generate skill examples

on:
  push:
    branches: [dev]
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual triggering


jobs:
  run-script:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install skills
        run: |
          pip install --pre ovos-plugin-manager
          pip install --pre -r https://raw.githubusercontent.com/OpenVoiceOS/OpenVoiceOS/refs/heads/main/lists/skills.list

      - name: Generate skill examples per language
        run: |
          python skills/gen.py

      - name: Commit to dev
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update skill examples
          branch: dev
